services:
  frontend:
    image: frontend
    build: ./frontend
    command: npm start
    environment:
      REACT_APP_API_URL: http://127.0.0.1:8080
    volumes:
      - ./frontend/src:/frontend/src
      - ./frontend/public:/frontend/public
    ports:
      - 3000:3000
    depends_on:
      - backend

  frontend-css:
    image: frontend-css
    build: ./frontend
    command: npm run build-css
    tty: true
    volumes:
      - ./frontend/src:/frontend/src
    depends_on:
      - frontend

  backend:
    image: backend
    build: ./backend
    volumes:
      - ./backend/src:/backend/src
      - ./backend/public:/backend/public
    environment:
      PORT: 8080
      MONGOURI: mongodb://mongo:27017/game-store
    ports:
      - 8080:8080
    depends_on:
      - mongo

  mongo:
    image: mongo
    restart: always

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongo
